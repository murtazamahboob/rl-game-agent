[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-game-agent"
version = "1.0.0"
description = "A Double DQN agent that learns to play Neon Catch, an original falling-objects arcade game — pure NumPy, no PyTorch, no Gym. Curriculum difficulty, training curves and a playable mode."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Murtaza Mahboob" }]
keywords = [
    "reinforcement-learning",
    "dqn",
    "deep-q-network",
    "double-dqn",
    "game-ai",
    "numpy",
    "arcade-game",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy==1.26.4",
    "matplotlib==3.8.4",
    "Pillow==10.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
gameagent = "gameagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
